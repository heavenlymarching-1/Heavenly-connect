<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#111;color:#fff;font-family:Arial;margin:0}
.header{padding:12px;background:#000;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold}
.card{background:#1e1e1e;border-radius:16px;overflow:hidden;position:relative;margin:8px}
.card img{width:100%;height:200px;object-fit:cover}
.online{position:absolute;top:8px;left:8px;background:#0f0;color:#000;padding:2px 8px;border-radius:10px;font-size:12px}
.offline{position:absolute;top:8px;left:8px;background:#777;color:#fff;padding:2px 8px;border-radius:10px;font-size:12px}
.msg-btn{width:calc(100% - 16px);margin:0 8px 8px;background:#e91e63;color:#fff;border:0;padding:10px;border-radius:10px}
#grid{display:grid;grid-template-columns:1fr 1fr}
.banner{text-align:center;padding:8px;background:#222}
</style></head><body>
<div class="header"><div class="logo">❤️ Heavenly Connect</div><div id="premBadge"></div></div>
<div class="banner">🔥 40 Singles • <span id="oc"></span> Online</div>
<div class="grid" id="grid"></div>
<script>
let names=["Neema","Asha","Faith","Grace","Zainabu","Rehema","Aisha","Tumaini","Ester","Irene","Lilian","Jackline","Hawa","Happy","Blandina","Catherine","Sarah","Winnie","Janeth","Fatma"];
let cities=["Dar","Arusha","Mwanza","Dodoma","Mbeya","Moshi","Tanga","Iringa"];
let profiles=[];for(let i=0;i<40;i++){let g=i<22?"women":"men";profiles.push({id:i,name:names[i%names.length],age:20+Math.floor(Math.random()*12),city:cities[Math.floor(Math.random()*cities.length)],img:`https://randomuser.me/api/portraits/${g}/${i+10}.jpg`,online:Math.random()>0.4})}
document.getElementById('premBadge').innerHTML=localStorage.getItem('isPremium')?'⭐ Premium':'';
document.getElementById('oc').textContent=profiles.filter(x=>x.online).length;
let grid=document.getElementById('grid');
profiles.forEach(p=>{grid.innerHTML+=`<div class="card"><img src="${p.img}"><div class="${p.online?'online':'offline'}">${p.online?'Online':'Offline'}</div><h3>${p.name}, ${p.age}</h3><p>${p.city}</p><button class="msg-btn" onclick="chat(${p.id})">Chat</button></div>`});
function chat(id){location.href='paywall.html'}
</script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCw3icfLZlToutBMuMH631CxX-HX_1eWFs",authDomain:"heavenly-connect.firebaseapp.com",projectId:"heavenly-connect"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const dbf=firebase.firestore();
dbf.collection('profiles').orderBy('created','desc').onSnapshot(s=>{
s.forEach(d=>{
let p=d.data();
let g=document.getElementById('grid');
g.innerHTML=`<div class="card"><img src="${p.img}"><div class="online">New</div><h3>${p.name}, ${p.age} - ${p.city}</h3><button class="msg-btn" onclick="location.href='paywall.html'">Chat $2</button></div>`+g.innerHTML;
});
});
</script>
</body></html>

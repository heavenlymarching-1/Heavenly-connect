<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jiunge - Heavenly</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#FF1493;display:flex;justify-content:center;padding:20px}.box{background:#fff;width:100%;max-width:360px;border-radius:20px;padding:20px}input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:12px}button{width:100%;background:#FF1493;color:#fff;border:none;padding:14px;border-radius:25px;font-weight:700;margin-top:10px}</style></head><body><div class="box"><h2 style="text-align:center;color:#FF1493">Jiunge Heavenly 💖</h2><input id="name" placeholder="Jina lako"><input id="age" type="number" placeholder="Miaka"><select id="gender"><option value="Female">Mwanamke</option><option value="Male">Mwanaume</option></select><input id="location" placeholder="Mkoa - mf. Dar"><input id="phone" placeholder="Namba ya Simu"><input id="email" type="email" placeholder="Email yako"><input id="password" type="password" placeholder="Password (min 6)"><button id="btn">JISAJILI SASA</button><p style="text-align:center;margin-top:12px">Una akaunti? <a href="login.html">Ingia</a></p><p id="msg" style="text-align:center;color:red"></p></div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCw3icfLZlToutBMuMH631CxX-HX_1eWFs", authDomain: "heavenly-connect.firebaseapp.com", projectId: "heavenly-connect", storageBucket: "heavenly-connect.firebasestorage.app", messagingSenderId: "983105945990", appId: "1:983105945990:web:362eb8e31396d5456aac07" };
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
http://document.getElementById('btn').onclick=async()=>{
const name=document.getElementById('name').value,age=document.getElementById('age').value,gender=document.getElementById('gender').value,location=document.getElementById('location').value,phone=document.getElementById('phone').value,email=document.getElementById('email').value,password=document.getElementById('password').value;
if(!name||!email||!password){document.getElementById('msg').innerText="Jaza sehemu zote!";return;}
http://document.getElementById('btn').innerText="Inatuma...";
try{const cred=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,"users",cred.user.uid),{name,age,gender,location,phone,email,createdAt:new Date()});location.href="home.html";}catch(e){document.getElementById('msg').innerText=e.message;document.getElementById('btn').innerText="JISAJILI SASA";}};
</script></body></html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heavenly - Home</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#FFF0F5;padding:15px}.top{background:#fff;padding:12px;border-radius:15px;display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.card{background:#fff;border-radius:15px;padding:12px;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.05)}.card h4{color:#FF1493}.btn{width:100%;background:#FF1493;color:#fff;border:none;padding:8px;border-radius:20px;margin-top:8px;font-weight:700}</style></head><body><div class="top"><b>HEAVENLY 💖</b><button id="out" style="border:1px solid #FF1493;color:#FF1493;background:#fff;padding:6px 12px;border-radius:20px">Toka</button></div><h3 id="wel" style="margin-top:15px">Watu Karibu Nawe...</h3><div id="list" class="grid"></div><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCw3icfLZlToutBMuMH631CxX-HX_1eWFs", authDomain: "heavenly-connect.firebaseapp.com", projectId: "heavenly-connect", storageBucket: "heavenly-connect.firebasestorage.app", messagingSenderId: "983105945990", appId: "1:983105945990:web:362eb8e31396d5456aac07" };
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
onAuthStateChanged(auth,u=>{if(!u)location.href="login.html";else http://document.getElementById('wel').innerText="Karibu! Watu wa Dar";});
async function load(){const snap=await getDocs(collection(db,"users"));let h="";snap.forEach(d=>{const x=d.data();h+=`<div class=card><div style=font-size:40px>👤</div><h4>${x.name}</h4><small>${x.age} yrs, ${x.location}</small><button class=btn onclick="alert('Chat na ${x.name} - No: ${x.phone}')">CHAT</button></div>`});document.getElementById('list').innerHTML=h||"Hakuna watu bado, kuwa wa kwanza!";}
load();document.getElementById('out').onclick=()=>signOut(auth).then(()=>location.href="login.html");
</script></body></html>

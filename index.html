<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heavenly Connect Worldwide - Date Serious Pata Mtu Sahii</title>
<style>
body{margin:0;font-family:Arial;background:#0a0a1a;color:white}
.banner{width:100%;height:320px;background:url('banner.jpg') center/cover no-repeat}
.logo-box{text-align:center;padding:20px;background:#111}
.logo-box img{width:180px;border-radius:20px;box-shadow:0 0 30px gold}
.btn{background:gold;color:black;padding:10px 20px;border:none;border-radius:20px;font-weight:bold;cursor:pointer;width:100%}
.card{background:#222;border-radius:15px;padding:15px;margin:15px}
input,select{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none;background:#333;color:white}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;padding:15px}
.region{background:linear-gradient(135deg,#ff3366,#990033);padding:10px;border-radius:10px;text-align:center;font-weight:bold;cursor:pointer;font-size:12px}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:15px}
.profile{background:#1a1a2e;border-radius:15px;overflow:hidden;text-align:center;padding-bottom:8px}
.profile img{width:100%;height:140px;object-fit:cover}
.expired{filter:blur(10px);pointer-events:none}
</style>
</head>
<body>
<div class="banner"></div>
<div class="logo-box">
<img src="logo.jpg" alt="Heavenly">
<h1 style="color:gold;margin:5px 0">Heavenly Connect</h1>
<div style="color:#ffb6d9">Date Serious - Pata Mtu Sahii</div>
<div style="color:gold;font-size:13px">Heavenly Connect Worldwide</div>
<div id="timer" style="margin-top:10px;background:#ff3366;padding:6px 14px;border-radius:20px;display:inline-block;font-size:13px">Inapakia...</div>
</div>

<div class="card" style="border:2px solid gold" id="payCard">
<h3 style="color:gold;text-align:center;margin:5px">🔓 Lipa Auto - TID Ijifungue Yenyewe</h3>
<p style="text-align:center;font-size:12px">Tigo Pesa <b style="color:gold">0674429728</b> - Jina: Heavenly Connect</p>
<select id="plan">
<option value="7">WIKI - 5,000 TZS (Siku 7)</option>
<option value="30">MWEZI - 15,000 TZS (Siku 30) - Bora</option>
</select>
<input type="text" id="phone" placeholder="Namba yako ya Tigo 0674...">
<input type="text" id="tid" placeholder="Weka Transaction ID mf: TP123...">
<div id="status" style="text-align:center;font-weight:bold;margin:8px;min-height:20px"></div>
<button class="btn" onclick="lipa()">THIBITISHA MALIPO</button>
</div>

<h2 style="padding-left:15px;color:gold;font-size:16px">Mikoa 31 Yote Tanzania</h2>
<div class="regions" id="regions"></div>

<h2 style="padding-left:15px;color:#ff88aa;font-size:16px">Watu 50 Online Leo <span id="lockIcon"></span></h2>
<div class="profiles" id="profiles"></div>

<div style="text-align:center;padding:20px">
<a href="#" onclick="admin()" style="color:#555;font-size:10px;text-decoration:none">Admin Portal</a>
</div>

<script>
const mikoa=["Arusha","Dar es Salaam","Dodoma","Geita","Iringa","Kagera","Katavi","Kigoma","Kilimanjaro","Lindi","Manyara","Mara","Mbeya","Morogoro","Mtwara","Mwanza","Njombe","Pwani","Rukwa","Ruvuma","Shinyanga","Simiyu","Singida","Songwe","Tabora","Tanga","Kaskazini Pemba","Kusini Pemba","Kaskazini Unguja","Kusini Unguja","Mjini Magharibi"];
const regDiv=document.getElementById('regions');
mikoa.forEach(m=>{
let d=document.createElement('div');
d.className='region';d.innerText=m;
d.onclick=()=>{localStorage.setItem('mkoa',m);alert('Umechagua '+m);};
regDiv.appendChild(d);
});

const profDiv=document.getElementById('profiles');
for(let i=1;i<=50;i++){
let p=document.createElement('div');p.className='profile';
p.innerHTML=`<img src="https://randomuser.me/api/portraits/${i%2==0?'women':'men'}/${10+i}.jpg"><div style="padding:5px"><b>${i%2==0?'Neema':'Baraka'} ${20+i}</b><br><small>${mikoa[i%31]}</small><br><button class="btn" style="padding:5px;font-size:11px;margin-top:4px" onclick="check()">Chat</button></div>`;
profDiv.appendChild(p);
}

function lipa(){
let tid=document.getElementById('tid').value.trim();
let phone=document.getElementById('phone').value.trim();
let days=parseInt(document.getElementById('plan').value);
if(tid.length<8||phone.length<10){alert('Jaza namba ya simu na TID sahihi');return;}
let expiry=Date.now()+(days*24*60*60*1000);
localStorage.setItem('myTid',tid);
localStorage.setItem('myExpiry',expiry);
let malipo=JSON.parse(localStorage.getItem('malipo')||'[]');
malipo.push({tid:tid,phone:phone,days:days,expiry:expiry,expiryStr:new Date(expiry).toLocaleString(),createdStr:new Date().toLocaleString()});
localStorage.setItem('malipo',JSON.stringify(malipo));
document.getElementById('status').innerHTML='✅ IMEFUNGULIWA';
alert('Hongera! Imefunguliwa kwa siku '+days+'\nItafungwa: '+new Date(expiry).toLocaleString());
location.reload();
}

function checkExpiry(){
let expiry=parseInt(localStorage.getItem('myExpiry')||'0');
let timer=document.getElementById('timer');
let payCard=document.getElementById('payCard');
let profiles=document.getElementById('profiles');
let lockIcon=document.getElementById('lockIcon');
if(!expiry){
timer.innerText='🔒 Hujalipa - Lipa Kufungua';
payCard.style.display='block';
profiles.classList.add('expired');
lockIcon.innerText='🔒';
return false;
}
let diff=expiry-Date.now();
if(diff<=0){
localStorage.removeItem('myExpiry');
localStorage.removeItem('myTid');
timer.innerText='⏰ Muda Umeisha - Lipa Tena';
timer.style.background='red';
payCard.style.display='block';
profiles.classList.add('expired');
lockIcon.innerText='🔒 IMEFUNGWA';
return false;
}
let d=Math.floor(diff/(1000*60*60*24));
let h=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((diff%(1000*60*60))/(1000*60));
timer.innerText=`✅ Active: Siku ${d} Saa ${h} Dak ${m} - TID:${localStorage.getItem('myTid')}`;
timer.style.background='green';
payCard.style.display='none';
profiles.classList.remove('expired');
lockIcon.innerText='✅';
return true;
}

function check(){
if(!checkExpiry()){
alert('Lipa kwanza 5k/15k na uweke TID');
window.scrollTo(0,200);
return;
}
alert('Chat inafunguka... (unganisha na WhatsApp)');
}

setInterval(checkExpiry,10000);
checkExpiry();

function admin(){
let p=prompt('Weka Password ya Admin:');
if(p!=='heavenly2026'){if(p)alert('Password si sahihi');return;}
let malipo=JSON.parse(localStorage.getItem('malipo')||'[]');
let html=`<div style="background:white;color:black;padding:15px;font-family:Arial"><h3>Heavenly Admin Portal</h3><p>Jumla ya Malipo: ${malipo.length}</p><table border=1 cellpadding=6 style="width:100%;font-size:11px;border-collapse:collapse"><tr style="background:gold"><th>TID</th><th>Phone</th><th>Siku</th><th>Mwanzo</th><th>Mwisho</th><th>Status</th></tr>`;
malipo.forEach(mm=>{
let act=mm.expiry>Date.now()?'ACTIVE':'EXPIRED';
let col=act==='ACTIVE'?'green':'red';
html+=`<tr><td>${mm.tid}</td><td>${mm.phone}</td><td>${mm.days}</td><td>${mm.createdStr}</td><td>${mm.expiryStr}</td><td style="color:${col};font-weight:bold">${act}</td></tr>`;
});
html+=`</table><br><button onclick="if(confirm('Futa data zote?')){localStorage.clear();location.reload()}" style="background:red;color:white;padding:8px 12px;border:none;border-radius:6px">Futa Data Zote</button> <button onclick="location.reload()" style="padding:8px 12px">Rudi Site</button><br><br><small>Expiry inafanya kazi auto kila 10 sec</small></div>`;
document.body.innerHTML=html;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wanaume - Heavenly</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff}
header{display:flex;justify-content:space-between;padding:12px 18px;position:sticky;top:0;background:#000;z-index:10}
.logo{color:#ff2d55;font-weight:900;font-size:22px}
.card{position:relative;width:92%;max-width:400px;height:70vh;margin:14px auto;border-radius:20px;overflow:hidden;background:#222}
.card img{width:100%;height:100%;object-fit:cover}
.blur img{filter:blur(18px) brightness(0.7);transform:scale(1.1)}
.info{position:absolute;bottom:0;width:100%;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,0.95))}
.online{position:absolute;top:14px;left:14px;background:rgba(0,0,0,0.6);padding:6px 10px;border-radius:20px;font-size:11px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;background:#00ff66;border-radius:50%;box-shadow:0 0 8px #00ff66}
.btns{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;padding:13px;border-radius:30px;border:none;font-weight:bold}
.chat{background:#ff2d55;color:#fff}
.next{background:#2a2a2a;color:#fff}
.lock{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.75);padding:14px 20px;border-radius:14px;text-align:center}
.nav{display:flex;justify-content:center;gap:10px;margin:10px}
.nav a{padding:8px 18px;border-radius:20px;background:#222;color:#fff;text-decoration:none;font-size:13px}
.nav a.active{background:#ff2d55}
</style>
</head>
<body>
<header><div class="logo">HEAVENLY</div><div>🔥 💬 👤</div></header>
<div class="nav"><a href="discover.html">Wanawake 60</a><a class="active" href="wanaume.html">Wanaume 40</a></div>
<div style="text-align:center;color:#666;font-size:12px;margin:6px">Wanaume 40 karibu na Dar - 28 Online now</div>
<div id="feed"></div>
<script>
const names=["Baraka","Juma","Hassan","Ali","Abdul","Iddi","Musa","Issa","Rajab","Ramadhan","Yusuph","Hamisi","Omari","Salum","Seif","Bakari","Khalid","Ibrahim","Mohamed","Ahmad","Joseph","John","James","Peter","David","Emmanuel","Michael","Daniel","Patrick","Frank","Kelvin","Brian","Victor","Chris","Joshua","Josh","Kevin","Eric","Alex","Sam"];
const feed=document.getElementById("feed");
let paid=localStorage.getItem('heavenly_paid')=='true';
for(let i=0;i<40;i++){
 let p={name:names[i],age:20+Math.floor(Math.random()*12),city:["Dar","Arusha","Mwanza","Dodoma"][i%4],img:`https://randomuser.me/api/portraits/men/${(i%70)+10}.jpg`};
 let isBlur=i>=3&&!paid;
 let div=document.createElement("div");
 div.className="card"+(isBlur?" blur":"");
 div.innerHTML=`<img src="${p.img}" onerror="this.src='https://i.pravatar.cc/400?img=${i+20}'"><div class="online"><div class="dot"></div> Online now</div>${isBlur?`<div class="lock">🔒<br><b>${p.name}, ${p.age}</b><br><small>Lipia kuona na kuchat</small></div>`:""}<div class="info"><h3>${p.name}, ${p.age}</h3><p style="font-size:12px;color:#bbb">📍 ${p.city} • Online • Natafuta mpenzi wa kweli</p><div class="btns"><button class="btn chat" onclick="chat(${i})">💬 Chat na ${p.name}</button><button class="btn next">Next</button></div></div>`;
 feed.appendChild(div);
}
function chat(i){if(localStorage.getItem('heavenly_paid')=='true'||i<3){alert("Chat imefunguliwa!");}else{location.href='lipia.html';}}
</script>
</body>
</html>

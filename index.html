<!DOCTYPE html>
<html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heavenly Connect</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e0e0e;color:#fff;font-family:system-ui}
.header{background:#1a1a1a;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10;border-bottom:1px solid #333}
.logo{color:#ff2d95;font-weight:900}.prem{background:#00e676;color:#000;padding:6px 12px;border-radius:20px;font-weight:800;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;max-width:500px;margin:auto}
.card{background:#1e1e1e;border-radius:16px;overflow:hidden;position:relative;border:1px solid #2a2a2a}
.card img{width:100%;height:200px;object-fit:cover}
.online{position:absolute;top:8px;left:8px;background:#00e676;color:#000;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:900}
.offline{position:absolute;top:8px;left:8px;background:#444;color:#aaa;padding:4px 8px;border-radius:12px;font-size:10px}
.msg-btn{width:calc(100% - 16px);margin:0 8px 8px;background:#ff2d95;color:#fff;border:0;padding:8px;border-radius:10px;font-weight:800}
.banner{max-width:500px;margin:10px auto;background:linear-gradient(90deg,#ff2d95,#ff6b35);padding:12px;border-radius:12px;text-align:center;font-weight:800}
</style></head><body>
<div class="header"><div class="logo">❤️ Heavenly Connect</div><div id="premBadge"></div></div>
<div class="banner">🔥 40 Singles • <span id="oc"></span> Online • TZ</div>
<div class="grid" id="grid"></div>
<script>
const names=["Neema","Asha","Faith","Grace","Zainabu","Hadija","Rehema","Aisha","Maryam","Fatma","Zuwena","Salma","Mwanaidi","Hawa","Latifa","Mariam","Tatu","Nuru","Pendo","Zahra","Jack","John","Musa","Baraka","Kelvin","David","Emmanuel","Frank","Joseph","Peter","Michael","Ismail","Abdul","Hassan","Juma","Ali","Salum","Rajabu","Iman"];
const cities=["Dar","Arusha","Mwanza","Dodoma","Mbeya","Tanga","Morogoro","Zanzibar","Moshi","Iringa"];
let profiles=[];for(let i=0;i<40;i++){let g=i<22?"women":"men";profiles.push({id:i+1,name:names[i],age:21+(i%12),city:cities[i%10],photo:`https://randomuser.me/api/portraits/${g}/${10+i}.jpg`,online:(i%4)!=3})}
document.getElementById('premBadge').innerHTML=localStorage.getItem('heavenly_premium')==='yes'?'<span class="prem">✅ PREMIUM</span>':'<span class="prem" style="background:#ff2d95;color:#fff" onclick="location.href=\'paywall.html\'">🔒 UNLOCK</span>';
document.getElementById('oc').textContent=profiles.filter(p=>p.online).length;
let grid=document.getElementById('grid');
profiles.forEach(p=>{grid.innerHTML+=`<div class="card" onclick="openChat(${p.id})"><img src="${p.photo}"><span class="${p.online?'online':'offline'}">${p.online?'🟢 ONLINE':'Offline'}</span><div style="padding:8px"><b>${p.name}, ${p.age}</b><br><small style="color:#aaa">${p.city}</small></div><button class="msg-btn">💬 Chat</button></div>`;});
function openChat(id){let p=profiles.find(x=>x.id===id);if(localStorage.getItem('heavenly_premium')!=='yes'){location.href='paywall.html?name='+encodeURIComponent(p.name+', '+p.age+' - '+p.city)+'&img='+encodeURIComponent(p.photo);return;}alert('💬 Chat na '+p.name+' - Premium active!');}
</script></body></html>

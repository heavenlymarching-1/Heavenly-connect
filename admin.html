<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Heavenly Connect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding:12px}
h1{color:gold;text-align:center;margin:10px}
.login{max-width:320px;margin:50px auto;background:#111;padding:20px;border-radius:16px;border:1px solid #333;text-align:center}
.login input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;margin:10px 0}
.login button{width:100%;padding:14px;border:0;border-radius:12px;background:gold;font-weight:900}
.table{width:100%;border-collapse:collapse;margin-top:10px;background:#111}
.table th{background:gold;color:#000;padding:10px;font-size:12px}
.table td{padding:10px;border-bottom:1px solid #222;font-size:12px;word-break:break-all}
.stats{display:flex;gap:10px;margin:10px 0}
.stat{flex:1;background:#111;padding:12px;border-radius:12px;text-align:center;border:1px solid #333}
.stat b{color:gold;font-size:20px;display:block}
#main{display:none}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
<h1>HEAVENLY ADMIN</h1>
<div id="loginBox" class="login">
<h3 style="color:gold">Ingia Admin</h3>
<input type="password" id="pass" placeholder="Password">
<button onclick="login()">INGIA</button>
</div>
<div id="main">
<div class="stats">
<div class="stat"><b id="total">0</b>Waliolipa</div>
<div class="stat"><b id="today">0</b>Leo</div>
<div class="stat"><b id="amount">0</b>TZS</div>
</div>
<button onclick="loadData()" style="width:100%;padding:12px;background:gold;border:0;border-radius:12px;font-weight:900">REFRESH</button>
<table class="table">
<thead><tr><th>Tarehe</th><th>Simu</th><th>TID</th><th>Kiasi</th></tr></thead>
<tbody id="list"></tbody>
</table>
</div>
<script>
const firebaseConfig = {
 apiKey: "AIzaSyDigFu8i7GOq9jlCEkmO1FCqX8qIg-nxWM",
 authDomain: "heavenlymarching.firebaseapp.com",
 projectId: "heavenlymarching",
 storageBucket: "heavenlymarching.firebasestorage.app",
 messagingSenderId: "232171626573",
 appId: "1:232171626573:web:76575b039fe185c6d43c04"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
function login(){
 let p=document.getElementById('pass').value;
 if(p==="0674429728"||p==="heavenly"){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('main').style.display='block';
  loadData();
 }else alert('Password sio sahihi');
}
async function loadData(){
 let snap=await db.collection('payments').orderBy('time','desc').limit(100).get();
 let html=""; let total=0; let todayCount=0; let todayStr=new Date().toISOString().slice(0,10);
 snap.forEach(doc=>{
  let d=doc.data(); total+=Number(d.amount||0);
  if(d.time&&d.time.includes(todayStr)) todayCount++;
  let date=d.time?d.time.slice(0,16).replace('T',' '):'';
  html+=`<tr><td>${date}</td><td>${d.phone||''}</td><td style="color:#0f0">${d.tid||''}</td><td>${d.amount||''}</td></tr>`;
 });
 document.getElementById('list').innerHTML=html||'<tr><td colspan=4 style="text-align:center">Hakuna bado</td></tr>';
 document.getElementById('total').innerText=snap.size;
 document.getElementById('today').innerText=todayCount;
 document.getElementById('amount').innerText=total.toLocaleString();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<div class="wrap"><div class="card" id="card">
<div style="text-align:center"><h2 style="color:#ff2d95">🔒 Fungua Chat</h2><img id="pImg" src="https://randomuser.me/api/portraits/women/68.jpg" style="width:85px;height:85px;border-radius:50%;border:3px solid #ff2d95"><h3 id="pName">Neema, 24 - Dar</h3></div>

<div style="background:#252525;border-radius:14px;padding:14px;margin:14px 0"><p style="margin:0;font-weight:900">🇹🇿 TigoPesa / Bank</p><div style="background:#111;padding:10px;border-radius:8px;margin:8px 0;font-size:13px">📱 <b style="color:#4caf50">0674429728</b><br>💰 5000 TZS</div><input id="txid" class="input" placeholder="Transaction ID"><button class="btn btn-green" onclick="unlockTx()">✅ Fungua</button><div style="text-align:center;margin:8px 0;color:#666;font-size:12px">— AU —</div><button class="btn btn-dark" onclick="trustUnlock()">🤝 Nimeshalipia</button></div>

let q=new URLSearchParams(location.search);if(q.get('name'))document.getElementById('pName').textContent=q.get('name');if(q.get('img'))document.getElementById('pImg').src=q.get('img');

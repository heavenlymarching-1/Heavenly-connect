<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heavenly Connect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff}
.top{background:#020b2b;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:99}
.left{display:flex;align-items:center;gap:10px}
.top img{width:48px;height:48px;border-radius:12px;border:2px solid #FFD700;object-fit:cover}
.top b{color:#FFD700;font-size:14px;line-height:1.1;text-transform:uppercase}
.top b span{color:#fff;font-size:10px;display:block;font-weight:400;text-transform:none;margin-top:3px;letter-spacing:1px}
.top a{background:#FFD700;color:#000;padding:10px 20px;border-radius:25px;text-decoration:none;font-weight:900;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#111;border-radius:16px;overflow:hidden}
.pic{height:210px;position:relative;background:#222}
.pic img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:800;background:#00d26a;color:#fff}
.info{padding:10px}.info b{font-size:14px}.info p{font-size:12px;color:#aaa;margin:4px 0 8px}
.chat{width:100%;padding:11px;border:0;border-radius:12px;background:#ff0055;color:#fff;font-weight:800}
</style>
</head>
<body>
<div class="top">
<div class="left">
<img src="IMG-20261006-WA0441.jpg">
<b>HEAVENLY<br>CONNECT<span>Uaminifu thabiti</span></b>
</div>
<a href="register.html">JISAJILI</a>
</div>
<div class="grid" id="g"></div>
<script>
let women=["Neema","Aisha","Zawadi","Rehema","Grace","Faith","Joyce","Asha","Zainab","Happy","Glory","Irene","Flora","Agnes","Eva","Stella","Lucy","Jane","Sarah","Deborah","Esther","Ruth","Tumaini","Upendo","Furaha","Salma","Hadija","Mariam","Anitha","Winnie"];
let men=["Brian","Kelvin","Joseph","David","John","Peter","Musa","Baraka","Daniel","Frank","Mike","Joshua","Emmanuel","Victor","Sam","Alex","Erick","Collins","Martin","Godfrey"];
let all=[];
women.forEach((n,i)=>all.push({j:n,a:22+Math.floor(Math.random()*7),m:"Dar",p:`https://randomuser.me/api/portraits/women/${i+10}.jpg`}));
men.forEach((n,i)=>all.push({j:n,a:26+Math.floor(Math.random()*7),m:"Dar",p:`https://randomuser.me/api/portraits/men/${i+11}.jpg`}));
document.getElementById('g').innerHTML=all.map(v=>`<div class="card"><div class="pic"><img src="${v.p}"><span class="badge">Online</span></div><div class="info"><b>${v.j}, ${v.a}</b><p>${v.m}</p><button class="chat" onclick="location.href='paywall.html'">Chat</button></div></div>`).join('');
</script>
</body>
</html>

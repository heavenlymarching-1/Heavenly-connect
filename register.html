<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jiunge - Heavenly Marching</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#020b2b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;width:100%;max-width:400px;border-radius:20px;padding:25px}
#prev{width:100%;height:220px;background:#f2f2f2;border-radius:14px;margin:10px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#prev img{width:100%;height:100%;object-fit:cover}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:8px 0;font-size:15px}
.btn{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#FFD700,#FFA500);font-weight:900;font-size:16px;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<input type="text" id="jina" placeholder="Jina lako">
<input type="number" id="umri" placeholder="Umri">
<select id="jinsia"><option value="">Jinsia</option><option>Mwanamke</option><option>Mwanaume</option></select>
<input type="file" id="picha" accept="image/*">
<div id="prev">Picha</div>
<input type="text" id="mji" placeholder="Mji">
<input type="tel" id="namba" placeholder="WhatsApp">
<button class="btn" onclick="sava()">JIUNGE</button>
</div>
<script>
let imgData='';
picha.addEventListener('change',e=>{
 let r=new FileReader();
 r.onload=()=>{imgData=r.result;prev.innerHTML=`<img src="${r.result}">`}
 r.readAsDataURL(e.target.files[0])
});
function sava(){
 if(!jina.value||!umri.value||!imgData){alert('Jaza jina, umri na picha');return}
 let w=JSON.parse(localStorage.getItem('heavenly_watu')||'[]');
 w.unshift({jina:jina.value,umri:umri.value,jinsia:jinsia.value,mji:mji.value,namba:namba.value,picha:imgData});
 localStorage.setItem('heavenly_watu',JSON.stringify(w));
 alert('Umesajiliwa!'); location.href='index.html';
}
</script>
</body>
</html>

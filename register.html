<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jisajili</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:system-ui}
.wrap{max-width:430px;margin:0 auto;padding:16px}.card{background:#1e1e1e;border-radius:20px;padding:20px;border:1px solid #333}
.input{width:100%;padding:13px;border-radius:10px;border:1px solid #555;background:#111;color:#fff;margin-top:10px}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:900;margin-top:14px;background:#ff2d95;color:#fff}
</style></head><body>
<div class="wrap"><div class="card">
<input id="name" class="input" placeholder="Jina la utani">
<select id="age" class="input"><option>20</option><option>22</option><option>24</option><option>26</option><option>28</option></select>
<select id="city" class="input"><option>Dar</option><option>Arusha</option><option>Iringa</option><option>Mbeya</option><option>Mwanza</option><option>Dodoma</option></select>
<input id="phone" class="input" placeholder="WhatsApp">
<input id="img" class="input" placeholder="Link ya picha">
<textarea id="bio" class="input" placeholder="Bio"></textarea>
<button class="btn" onclick="save()">Jisajili</button>
</div></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCw3icfLZlToutBMuMH631CxX-HX_1eWFs",
  authDomain: "heavenly-connect.firebaseapp.com",
  projectId: "heavenly-connect",
  storageBucket: "heavenly-connect.firebasestorage.app",
  messagingSenderId: "983105945990",
  appId: "1:983105945990:web:362eb8e31396d5456aac07"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
async function save(){
let n=document.getElementById('name').value, a=document.getElementById('age').value, c=document.getElementById('city').value, p=document.getElementById('phone').value, b=document.getElementById('bio').value;
let img=document.getElementById('img').value || `https://randomuser.me/api/portraits/women/${Math.floor(Math.random()*70)}.jpg`;
if(n.length<2){alert('Jaza jina');return}
await db.collection('profiles').add({name:n,age:a,city:c,phone:p,bio:b,img:img,created:Date.now()});
location.href='index.html';
}
</script></body></html>
